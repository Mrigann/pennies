<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Penny Trading System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Penny Trading System</a>
            <div class="navbar-nav flex-row">
                <a class="nav-link me-3" href="/">Dashboard</a>
                <a class="nav-link me-3" href="/trade">Trade</a>
                <a class="nav-link me-3" href="/scanner">Scanner</a>
                <a class="nav-link me-3" href="/positions">Positions</a>
                <a class="nav-link me-3" href="/approvals">Approvals</a>
                <a class="nav-link me-3 active" href="/analytics">Analytics</a>
                <a class="nav-link" href="/orders">Orders</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <h1>Performance Analytics</h1>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Total Net P&L</h6>
                        <h4 id="total-pnl">$0.00</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Win Rate</h6>
                        <h4 id="win-rate">0%</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Avg Daily P&L</h6>
                        <h4 id="avg-daily">$0.00</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h6>Total Trades</h6>
                        <h4 id="total-trades">0</h4>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Daily P&L</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="dailyPnlChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Cumulative P&L</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="cumulativePnlChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Win/Loss Distribution</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="winLossChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Trade Frequency</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="tradeFrequencyChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let dailyPnlChart, cumulativePnlChart, winLossChart, tradeFrequencyChart;

        function loadCharts() {
            // Daily P&L Chart
            fetch('/api/charts/daily-pnl')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error('Error loading daily P&L chart:', data.error);
                        return;
                    }
                    const ctx = document.getElementById('dailyPnlChart').getContext('2d');
                    if (dailyPnlChart) {
                        dailyPnlChart.destroy();
                    }
                    dailyPnlChart = new Chart(ctx, {
                        type: 'line',
                        data: data,
                        options: {
                            responsive: true,
                            plugins: {
                                title: { display: true, text: 'Daily Profit & Loss' }
                            }
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading daily P&L chart:', error);
                });

            // Cumulative P&L Chart
            fetch('/api/charts/cumulative-pnl')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error('Error loading cumulative P&L chart:', data.error);
                        return;
                    }
                    const ctx = document.getElementById('cumulativePnlChart').getContext('2d');
                    if (cumulativePnlChart) {
                        cumulativePnlChart.destroy();
                    }
                    cumulativePnlChart = new Chart(ctx, {
                        type: 'line',
                        data: data,
                        options: {
                            responsive: true,
                            plugins: {
                                title: { display: true, text: 'Cumulative Profit & Loss' }
                            }
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading cumulative P&L chart:', error);
                });

            // Win/Loss Chart
            fetch('/api/charts/win-loss')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error('Error loading win/loss chart:', data.error);
                        return;
                    }
                    const ctx = document.getElementById('winLossChart').getContext('2d');
                    if (winLossChart) {
                        winLossChart.destroy();
                    }
                    winLossChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: data,
                        options: {
                            responsive: true,
                            plugins: {
                                title: { display: true, text: 'Winning vs Losing Trades' }
                            }
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading win/loss chart:', error);
                });

            // Trade Frequency Chart
            fetch('/api/charts/trade-frequency')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error('Error loading trade frequency chart:', data.error);
                        return;
                    }
                    const ctx = document.getElementById('tradeFrequencyChart').getContext('2d');
                    if (tradeFrequencyChart) {
                        tradeFrequencyChart.destroy();
                    }
                    tradeFrequencyChart = new Chart(ctx, {
                        type: 'bar',
                        data: data,
                        options: {
                            responsive: true,
                            plugins: {
                                title: { display: true, text: 'Trades per Day' }
                            }
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading trade frequency chart:', error);
                });

            // Load metrics
            fetch('/api/metrics')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error('Error loading metrics:', data.error);
                        return;
                    }
                    document.getElementById('total-pnl').textContent = `$${data.net_pnl.toFixed(2)}`;
                    document.getElementById('win-rate').textContent = `${(data.win_rate * 100).toFixed(1)}%`;
                    document.getElementById('avg-daily').textContent = `$${data.avg_daily_pnl.toFixed(2)}`;
                    document.getElementById('total-trades').textContent = data.total_trades;
                })
                .catch(error => {
                    console.error('Error loading metrics:', error);
                });
        }

        // Load charts on page load
        loadCharts();

        // Refresh every 60 seconds
        setInterval(loadCharts, 60000);
    </script>
</body>
</html>

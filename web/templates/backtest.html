<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backtesting - Penny Trading System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Penny Trading System</a>
            <div class="navbar-nav flex-row">
                <a class="nav-link me-3" href="/">Dashboard</a>
                <a class="nav-link me-3" href="/trade">Trade</a>
                <a class="nav-link me-3" href="/scanner">Scanner</a>
                <a class="nav-link me-3" href="/positions">Positions</a>
                <a class="nav-link me-3" href="/approvals">Approvals</a>
                <a class="nav-link me-3" href="/analytics">Analytics</a>
                <a class="nav-link" href="/orders">Orders</a>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="row mb-3">
            <div class="col-md-12">
                <h1>Strategy Backtesting</h1>
                <p class="text-muted" style="font-size: 0.85rem;">Test trading strategies on historical data</p>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header py-2">
                        <h6 class="mb-0">Backtest Parameters</h6>
                    </div>
                    <div class="card-body p-compact">
                        <div class="mb-2">
                            <label class="form-label">Symbol</label>
                            <input type="text" class="form-control form-control-sm" id="backtest-symbol" 
                                   placeholder="AAPL" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control form-control-sm" id="backtest-start" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">End Date</label>
                            <input type="date" class="form-control form-control-sm" id="backtest-end" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Initial Capital ($)</label>
                            <input type="number" class="form-control form-control-sm" id="backtest-capital" 
                                   value="10000" min="1000" step="1000">
                        </div>
                        <div class="mb-2">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="backtest-scaling" checked>
                                <label class="form-check-label" for="backtest-scaling">
                                    Use Scaling Exit Strategy
                                </label>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-sm w-100" onclick="runBacktest()">Run Backtest</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header py-2">
                        <h6 class="mb-0">Results</h6>
                    </div>
                    <div class="card-body p-compact" id="backtest-results">
                        <p class="text-muted text-center" style="font-size: 0.85rem;">Run a backtest to see results</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-3" id="backtest-charts" style="display: none;">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header py-2">
                        <h6 class="mb-0">Equity Curve</h6>
                    </div>
                    <div class="card-body p-compact">
                        <canvas id="equity-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let equityChart = null;

        // Set default dates (last 30 days)
        const endDate = new Date();
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 30);
        
        document.getElementById('backtest-start').value = startDate.toISOString().split('T')[0];
        document.getElementById('backtest-end').value = endDate.toISOString().split('T')[0];

        function runBacktest() {
            const symbol = document.getElementById('backtest-symbol').value.toUpperCase().trim();
            const startDate = document.getElementById('backtest-start').value;
            const endDate = document.getElementById('backtest-end').value;
            const capital = parseFloat(document.getElementById('backtest-capital').value);
            const useScaling = document.getElementById('backtest-scaling').checked;

            if (!symbol || !startDate || !endDate) {
                alert('Please fill in all required fields');
                return;
            }

            const resultsDiv = document.getElementById('backtest-results');
            resultsDiv.innerHTML = '<p class="text-center">Running backtest...</p>';

            fetch('/api/backtest/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    symbol: symbol,
                    start_date: startDate + 'T00:00:00',
                    end_date: endDate + 'T23:59:59',
                    initial_capital: capital,
                    use_scaling: useScaling
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    resultsDiv.innerHTML = `<div class="alert alert-danger py-2">${data.error}</div>`;
                    return;
                }

                const stats = data.statistics || {};
                const returnPct = data.total_return_pct || 0;
                const returnClass = returnPct >= 0 ? 'text-success' : 'text-danger';

                resultsDiv.innerHTML = `
                    <div class="mb-2">
                        <strong>Total Return:</strong> 
                        <span class="${returnClass}">$${data.total_return.toFixed(2)} (${returnPct.toFixed(2)}%)</span>
                    </div>
                    <div class="mb-2">
                        <strong>Initial Capital:</strong> $${data.initial_capital.toFixed(2)}
                    </div>
                    <div class="mb-2">
                        <strong>Final Capital:</strong> $${data.final_capital.toFixed(2)}
                    </div>
                    <div class="mb-2">
                        <strong>Total Trades:</strong> ${stats.total_trades || 0}
                    </div>
                    <div class="mb-2">
                        <strong>Win Rate:</strong> ${(stats.win_rate || 0).toFixed(1)}%
                    </div>
                    <div class="mb-2">
                        <strong>Profit Factor:</strong> ${(stats.profit_factor || 0).toFixed(2)}
                    </div>
                    <div class="mb-2">
                        <strong>Avg Win:</strong> $${(stats.avg_win || 0).toFixed(2)}
                    </div>
                    <div class="mb-2">
                        <strong>Avg Loss:</strong> $${(stats.avg_loss || 0).toFixed(2)}
                    </div>
                `;

                if (data.equity_curve && data.equity_curve.length > 0) {
                    document.getElementById('backtest-charts').style.display = 'block';
                    updateEquityChart(data.equity_curve);
                }
            })
            .catch(error => {
                console.error('Error running backtest:', error);
                resultsDiv.innerHTML = '<div class="alert alert-danger py-2">Error running backtest</div>';
            });
        }

        function updateEquityChart(equityCurve) {
            const ctx = document.getElementById('equity-chart').getContext('2d');
            
            if (equityChart) {
                equityChart.destroy();
            }

            const labels = equityCurve.map(point => {
                const date = new Date(point.timestamp);
                return date.toLocaleDateString();
            });
            const equity = equityCurve.map(point => point.equity);

            equityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Equity',
                        data: equity,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    },
                    plugins: {
                        legend: {
                            display: true
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
